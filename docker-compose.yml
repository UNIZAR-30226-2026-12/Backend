version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: reversi_backend
    restart: always
    expose:
      - "8081:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: reversi_frontend
    restart: always
    ports:
      - "8080:80"
    depends_on:
      - backend
